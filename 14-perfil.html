<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - HABIT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CABEÇALHO -->
    <header class="main-header">
        <div class="container header-container">
            <a href="1-home.html" class="logo">HABIT</a>
            
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="2-categoria.html">Páginas</a></li>
                    <li><a href="3-destaques.html">Destaques</a></li>
                    <li><a href="4-newsletter.html">Assinar</a></li>
                    <li><a href="5-admin-dashboard.html">Admin</a></li>
                </ul>
            </nav>

            <div class="header-actions">
                <input type="text" placeholder="Buscar..." class="search-input">
                <button class="btn btn-outline">Buscar</button>
                <a href="8-login.html" class="btn btn-outline">Entrar</a>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>
        <div class="container">
            
            <section class="profile-section">
                <div class="profile-container">
                    
                    <!-- Sidebar do Perfil -->
                    <div class="profile-sidebar">
                        <h3>Perfil</h3>
                        <div class="profile-avatar"></div>
                        <input type="text" placeholder="Nome" class="form-input">
                        <input type="text" placeholder="Bio" class="form-input">
                        <button class="btn btn-primary" style="width: 100%; margin-top: 10px;">Salvar</button>
                    </div>

                    <!-- Posts do Usuário -->
                    <div class="profile-posts">
                        <h2>Suas Postagens</h2>
                        <div class="post-list">
                            <div class="post-list-item">
                                <div class="post-list-thumb"></div>
                                <div class="post-list-info">
                                    <small>Rascunho</small>
                                    <h4>Post 1</h4>
                                </div>
                            </div>
                            <div class="post-list-item">
                                <div class="post-list-thumb"></div>
                                <div class="post-list-info">
                                    <small>Publicado</small>
                                    <h4>Post 2</h4>
                                </div>
                            </div>
                            <div class="post-list-item">
                                <div class="post-list-thumb"></div>
                                <div class="post-list-info">
                                    <small>Em análise</small>
                                    <h4>Comentário 1</h4>
                                </div>
                            </div>
                            <div class="post-list-item">
                                <div class="post-list-thumb"></div>
                                <div class="post-list-info">
                                    <small>Publicado</small>
                                    <h4>Comentário 2</h4>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </section>

        </div>
    </main>

    <!-- RODAPÉ -->
    <footer class="main-footer">
        <div class="container">
            <div class="footer-tags">
                <span class="tag">Instagram</span>
                <span class="tag">Work</span>
                <span class="tag">Bags</span>
                <span class="tag">Lamp</span>
                <span class="tag">Books</span>
            </div>
            <p>&copy; 2025 Meu Site • Meu site</p>
        </div>
    </footer>

</body>
</html>
